name: CI

on:
  push:
    branches: [main, feature/slock-like-webui]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'designs/**'
      - 'assets/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'designs/**'
      - 'assets/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
        env:
          CI_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/api build
      - run: pnpm --filter @cat-cafe/web build

  api-core:
    name: API Core Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-ci-with-annotations.mjs --label "API Core Tests" -- pnpm --filter @cat-cafe/api run test:public

  api-lanes:
    name: API ${{ matrix.lane }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [integration, slow]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/mcp-server build
      - run: pnpm --filter @cat-cafe/api build
      - run: node scripts/run-ci-with-annotations.mjs --label "API ${{ matrix.lane }} Tests" -- pnpm --filter @cat-cafe/api run test:lane:${{ matrix.lane }}

  api-redis:
    name: API Redis Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/mcp-server build
      - run: pnpm --filter @cat-cafe/api build
      - run: node scripts/run-ci-with-annotations.mjs --label "API Redis Tests" -- pnpm --filter @cat-cafe/api run test:lane:redis

  api-redis-security:
    name: API Redis Security Tests (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/api build
      # Fail-closed: the runner refuses to start without an isolated REDIS_URL
      # and fails loudly if any security suite runs 0 tests or skips (F-3).
      - run: node scripts/run-ci-with-annotations.mjs --label "API Redis Security Tests" -- pnpm --filter @cat-cafe/api run test:redis:security

  web-vitest:
    name: Web Vitest (Required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/web run test:ci:vitest

  web-quarantine:
    name: Web Quarantine Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/shared build
      - run: pnpm --filter @cat-cafe/web run test:ci:quarantine

  web-native-config:
    name: Web Native and Config Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/web run test:ci:config
      - run: pnpm --filter @cat-cafe/web run test:ci:native
      - run: pnpm --filter @cat-cafe/web run test:ci:recovery

  web-color:
    name: Web Color Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cat-cafe/web run test:ci:colors

  dir-size:
    name: Directory Size Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-dir-size.sh
