  - id: NQ-07
    context: "要给铲屎官汇报一大堆条目，用什么格式呈现比较合适？"
    expected_note: N-opus45-table-format
    note: "real-cat-memory sourced — opus-45.md 行为偏好"

  - id: NQ-08
    context: "回复铲屎官一段技术内容之后，还需要额外加点什么吗？"
