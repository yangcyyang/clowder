  - id: NQ-09
    context: "内部要做一次可逆的灰度测试，需要每次都先等铲屎官点头吗？"
    expected_note: N-opus45-autonomy-scope
    note: "real-cat-memory sourced — opus-45.md 行为偏好"

  - id: NQ-10
    context: "要把一个工程任务派给 Codex，派工的时候要注意写清楚什么？"
    expected_note: N-opus45-codex-delegation
    note: "real-cat-memory sourced — opus-45.md 环境 gotcha"

  - id: NQ-11
    context: "Pi 这种轻量对话 agent 要不要默认加载完整的历史上下文文档？"
    expected_note: N-pi-lightweight-no-heavy-context
    note: "real-cat-memory sourced — pi.md 已关闭决策"

  - id: NQ-12
    context: "轻量 agent 接到一个需要改代码、复杂调试的工程任务，应该怎么处理？"
    expected_note: N-pi-handoff-to-engineering
    note: "real-cat-memory sourced — pi.md 环境 gotcha"

  - id: NQ-13
    context: "旧货站点商品图同步的时候，素材路径读取上有什么已知的坑？"
    expected_note: N-gpt52-legacy-sync-gotcha
    note: "real-cat-memory sourced — gpt52.md 最近验证"

  - id: NQ-14
    context: "记忆条目发生冲突的时候，要不要按时间自动让旧的那条失效？"
    expected_note: N-f163-conflict-not-time
    note: "real-docs-history sourced — docs/features/F163-memory-entropy-reduction.md:71"

  - id: NQ-15
    context: "每轮都会变化的判定信息，应该放进 system 静态前缀还是队尾 meta 块？"
    expected_note: N-adr024-volatile-tail
    note: "real-docs-history sourced — docs/decisions/024-kv-cache-friendly-context-layout.md:113"
