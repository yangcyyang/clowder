<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">本地 Clowder AI 架构总览图</title>
  <desc id="desc">一张图描述本地 Clowder AI 从用户入口、Web Console、API Runtime、猫猫 Agent、消息协作、记忆知识、Pack Skills 到运维观测的整体关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="52%" stop-color="#fcfaf7"/>
      <stop offset="100%" stop-color="#f4eee8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5b4638" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6f60"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #241f1b; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #746b64; }
      .box { fill: #fffdfb; stroke: #dfd1c6; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .box-soft { fill: #f8f2ec; stroke: #e2d5ca; stroke-width: 1.2; rx: 16; }
      .box-core { fill: #fff6ef; stroke: #e29578; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-blue { fill: #eef7fb; stroke: #9fc9dc; stroke-width: 1.5; rx: 16; }
      .box-green { fill: #eff8f0; stroke: #a9cfaa; stroke-width: 1.5; rx: 16; }
      .box-purple { fill: #f6f0fb; stroke: #cdb9df; stroke-width: 1.5; rx: 16; }
      .box-amber { fill: #fff8e8; stroke: #e5c779; stroke-width: 1.5; rx: 16; }
      .label { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #2f2924; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #5e5148; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #746b64; }
      .pill { fill: #f0e6dc; stroke: #e2d5ca; stroke-width: 1; rx: 10; }
      .pill-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #6f5547; }
      .line { fill: none; stroke: #8a6f60; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #b49b8c; stroke-width: 1.7; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .section { font: 800 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #b35f42; letter-spacing: .12em; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980"/>
  <text class="title" x="56" y="62">本地 Clowder AI：从“聊天工具”到“多 Agent 平台”</text>
  <text class="subtitle" x="58" y="91">一眼看懂当前本地系统：用户提出目标，Console 承接操作，API 调度猫猫，消息/记忆/Pack/Skills 共同形成可运行的协作网络。</text>

  <!-- User layer -->
  <rect class="box-core" x="56" y="135" width="230" height="188"/>
  <text class="section" x="82" y="170">ENTRY</text>
  <text class="label" x="82" y="202">你 / CVO</text>
  <text class="small" x="82" y="234">提出目标、判断方向</text>
  <text class="small" x="82" y="258">决定 Pack / 频道 / 任务</text>
  <text class="small" x="82" y="282">不是 Boss Agent，而是现场总导演</text>

  <rect class="pill" x="82" y="296" width="70" height="28"/>
  <text class="pill-text" x="103" y="315">Web</text>
  <rect class="pill" x="160" y="296" width="70" height="28"/>
  <text class="pill-text" x="182" y="315">CLI</text>

  <!-- Web console -->
  <rect class="box" x="350" y="122" width="360" height="214"/>
  <text class="section" x="382" y="157">WEB CONSOLE</text>
  <text class="label" x="382" y="190">前端控制台</text>
  <text class="small" x="382" y="222">AppShell / ActivityBar / ThreadSidebar</text>
  <text class="small" x="382" y="247">Chat / Tasks / Files / Mission Hub</text>
  <text class="small" x="382" y="272">Settings Shell / Memory Hub / QueuePanel</text>
  <text class="tiny" x="382" y="304">当前分支重点：Slock-like Console、统一设置、任务和记忆入口</text>

  <!-- API runtime -->
  <rect class="box-core" x="790" y="116" width="340" height="226"/>
  <text class="section" x="824" y="151">API RUNTIME</text>
  <text class="label" x="824" y="184">后端运行时</text>
  <text class="small" x="824" y="216">Routes：messages / queue / packs / memory</text>
  <text class="small" x="824" y="241">Socket.IO：实时消息和状态同步</text>
  <text class="small" x="824" y="266">Scheduler：任务队列、回调、会话链</text>
  <text class="small" x="824" y="291">权限与安全：callback-auth / owner gate</text>

  <!-- Agents -->
  <rect class="box-purple" x="1190" y="135" width="154" height="188"/>
  <text class="section" x="1214" y="170">AGENTS</text>
  <text class="label" x="1214" y="202">猫猫团队</text>
  <text class="small" x="1214" y="232">Claude</text>
  <text class="small" x="1214" y="256">Codex</text>
  <text class="small" x="1214" y="280">Gemini / Kimi</text>
  <text class="small" x="1214" y="304">opencode</text>

  <!-- Collaboration protocols -->
  <rect class="box" x="190" y="416" width="1020" height="174"/>
  <text class="section" x="224" y="451">COLLABORATION PROTOCOLS</text>
  <text class="label" x="224" y="484">协作协议层：让多只猫猫不会互相抢话、漏话、乱传话</text>

  <rect class="box-blue" x="232" y="512" width="210" height="52"/>
  <text class="small" x="252" y="535">F175 统一消息队列</text>
  <text class="tiny" x="252" y="554">优先级、批处理、可观察</text>

  <rect class="box-blue" x="472" y="512" width="210" height="52"/>
  <text class="small" x="492" y="535">F183 Bubble Pipeline</text>
  <text class="tiny" x="492" y="554">稳定气泡、排序、去裂缝</text>

  <rect class="box-blue" x="712" y="512" width="210" height="52"/>
  <text class="small" x="732" y="535">F167 A2A Ball</text>
  <text class="tiny" x="732" y="554">持球、传球、防循环</text>

  <rect class="box-blue" x="952" y="512" width="210" height="52"/>
  <text class="small" x="972" y="535">Whisper 悄悄话</text>
  <text class="tiny" x="972" y="554">可见性过滤、指定对象</text>

  <!-- Memory -->
  <rect class="box-green" x="66" y="670" width="376" height="206"/>
  <text class="section" x="100" y="705">MEMORY / KNOWLEDGE</text>
  <text class="label" x="100" y="738">记忆与知识系统</text>
  <text class="small" x="100" y="770">evidence.sqlite：证据与事件底座</text>
  <text class="small" x="100" y="795">Thread / Session / Active Slot</text>
  <text class="small" x="100" y="820">Lexical + Semantic + Hybrid 检索</text>
  <text class="small" x="100" y="845">F186 LibraryCatalog / Collection</text>

  <!-- Packs and skills -->
  <rect class="box-amber" x="512" y="670" width="376" height="206"/>
  <text class="section" x="546" y="705">PACKS / SKILLS</text>
  <text class="label" x="546" y="738">Pack 与技能轨道</text>
  <text class="small" x="546" y="770">F129 Pack：多 Agent 世界模板</text>
  <text class="small" x="546" y="795">Skills：可复用工作流和规则</text>
  <text class="small" x="546" y="820">Shared Rules：质量门、Push Back</text>
  <text class="small" x="546" y="845">MCP portable provisioning</text>

  <!-- Ops -->
  <rect class="box-purple" x="958" y="670" width="376" height="206"/>
  <text class="section" x="992" y="705">OPS / OBSERVABILITY</text>
  <text class="label" x="992" y="738">运维与可观测</text>
  <text class="small" x="992" y="770">F153 Trace / Metrics / Health</text>
  <text class="small" x="992" y="795">F179 Desktop Installer</text>
  <text class="small" x="992" y="820">F180 CLI Hook Health</text>
  <text class="small" x="992" y="845">本地端口：Web 3003 / API 3004</text>

  <!-- arrows top -->
  <path class="line" d="M 286 225 C 315 225, 320 225, 350 225"/>
  <path class="line" d="M 710 225 C 746 225, 754 225, 790 225"/>
  <path class="line" d="M 1130 225 C 1156 225, 1164 225, 1190 225"/>
  <path class="line-soft" d="M 1190 282 C 1162 386, 1048 405, 1010 512"/>
  <path class="line-soft" d="M 960 342 C 932 386, 886 424, 817 512"/>
  <path class="line-soft" d="M 530 336 C 558 384, 570 430, 577 512"/>

  <!-- arrows lower -->
  <path class="line" d="M 700 590 C 700 626, 700 640, 700 670"/>
  <path class="line-soft" d="M 442 772 C 470 772, 484 772, 512 772"/>
  <path class="line-soft" d="M 888 772 C 916 772, 930 772, 958 772"/>
  <path class="line-soft" d="M 960 342 C 960 474, 1146 506, 1146 670"/>
  <path class="line-soft" d="M 530 336 C 430 478, 254 516, 254 670"/>

  <!-- footer note -->
  <rect class="box-soft" x="56" y="910" width="1288" height="42"/>
  <text class="tiny" x="78" y="936">读法：上半部分是“请求怎么进来并被调度”，中间是“多 Agent 怎么协作不乱套”，下半部分是“长期能力如何沉淀为记忆、Pack、Skills，并被观测和发布”。</text>
</svg>
